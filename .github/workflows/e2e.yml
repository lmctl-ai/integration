name: e2e

# Scenarios against PUBLISHED lmctl and lmmock. Runs on push/PR here, nightly, by hand, and as a reusable
# workflow (uses: lmctl-ai/integration/.github/workflows/e2e.yml@<sha>). Advisory: no release workflow waits for it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      lmctl:
        description: "lmctl tags, comma separated: latest, staging, X.Y.Z"
        default: "pinned,latest,staging"
      lmmock:
        description: "lmmock tags, comma separated: pinned (versions.lock), latest, vX.Y.Z"
        default: "pinned,latest"
  workflow_call:
    inputs:
      lmctl:
        type: string
        default: "pinned,latest,staging"
      lmmock:
        type: string
        default: "pinned,latest"
      integration-ref:
        description: "ref of lmctl-ai/integration to take scenarios from (a sha when called from another repo)"
        type: string
        default: main

permissions:
  contents: read

# New pushes cancel running PR checks, never a scheduled or called run.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      miniplayer: ${{ steps.plan.outputs.miniplayer }}
      node: ${{ steps.plan.outputs.node }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: lmctl-ai/integration
          ref: ${{ inputs.integration-ref || github.sha }}
      - id: plan
        env:
          LMCTL: ${{ inputs.lmctl }}
          LMMOCK: ${{ inputs.lmmock }}
        run: bash scripts/plan-matrix.sh

  selftest:
    name: setup selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: plan
    steps:
      - uses: actions/checkout@v5
        with:
          repository: lmctl-ai/integration
          ref: ${{ inputs.integration-ref || github.sha }}
      - run: bash tests/setup-selftest.sh

  scenarios:
    name: lmctl ${{ matrix.lmctl }} / lmmock ${{ matrix.lmmock }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: lmctl-ai/integration
          ref: ${{ inputs.integration-ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.plan.outputs.node }}
      - id: setup
        uses: ./actions/setup
        with:
          lmctl: ${{ matrix.lmctl }}
          tools: lmmock@${{ matrix.lmmock }}+examples.tar.gz
          miniplayer: ${{ needs.plan.outputs.miniplayer }}
      - name: Resolved versions
        run: |
          {
            echo "### Resolved"
            echo "- lmctl: ${{ steps.setup.outputs.lmctl-version }} (requested ${{ matrix.lmctl }})"
            echo "- lmmock: $(lmmock --version) (requested ${{ matrix.lmmock }})"
            echo "- miniplayer commit: ${{ needs.plan.outputs.miniplayer }}"
          } >> "$GITHUB_STEP_SUMMARY"
          lmctl --version; lmscript --version; lmmock --version
      - name: T0 scenarios (ClaudeMock, no network)
        run: bash scripts/run-all-scenarios.sh t0
      - name: T1 scenarios (miniplayer to lmmock llm-api)
        run: bash scripts/run-all-scenarios.sh t1
      - name: Failing controls
        run: bash tests/scenario-controls.sh

  suite-controls:
    name: ported suite controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    steps:
      - uses: actions/checkout@v5
        with:
          repository: lmctl-ai/integration
          ref: ${{ inputs.integration-ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.plan.outputs.node }}
      - name: Runner semantics and pure-suite mutations
        run: bash tests/suite-controls.sh

  mono-test:
    name: mono-test port / lmctl ${{ matrix.lmctl }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        lmctl: [latest, staging]
    steps:
      - uses: actions/checkout@v5
        with:
          repository: lmctl-ai/integration
          ref: ${{ inputs.integration-ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.plan.outputs.node }}
      - id: setup
        uses: ./actions/setup
        with:
          lmctl: ${{ matrix.lmctl }}
          miniplayer: ${{ needs.plan.outputs.miniplayer }}
      - name: Ported lmctl-mono-test suites
        env:
          INTEGRATION_BIN: ${{ runner.temp }}/integration-bin
        run: node suites/mono-test/run.mjs
      - name: Control, a lmctl that does nothing must turn every lmctl-driven suite red
        env:
          INTEGRATION_BIN: ${{ runner.temp }}/integration-bin
        run: node suites/mono-test/run.mjs --control broken-bin

  # One stable check name for the PR gate: red unless the selftest and every scenario leg are green.
  # Mark `gate` as the required status check of the main ruleset once the operator wants merges blocked.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [plan, selftest, scenarios, suite-controls, mono-test]
    steps:
      - name: Require green jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          bad=$(echo "$RESULTS" | node -e 'const n=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(Object.entries(n).filter(([,v])=>v.result!=="success").map(([k,v])=>k+"="+v.result).join(" "))')
          if [ -n "$bad" ]; then echo "::error::gate is red: $bad"; exit 1; fi
          echo "gate green"
